<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      @media print {
        body { margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; }
        .attendance-table { font-size: 7pt; line-height: 1.1; }
        .attendance-table h2 { margin: 0 0 2px 0; font-size: 10pt; }
        .attendance-table table { width: 100%; border-collapse: collapse; }
        .attendance-table th, .attendance-table td { padding: 1px 2px; border: 1px solid #000; }
        .attendance-table thead { background: #e2e8f0; }
        .no-print { display: none !important; }
        @page { margin: 0.3cm; size: A4 portrait; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
